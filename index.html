<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTT 工具安裝</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f0f2f5; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        h2 { margin-top: 0; color: #333; }
        input { width: 90%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #0084ff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:active { background: #0066cc; }
        textarea { width: 90%; height: 100px; margin-top: 15px; padding: 10px; border: 2px dashed #0084ff; border-radius: 8px; font-size: 14px; color: #555; word-break: break-all; }
        .note { font-size: 12px; color: #666; margin-top: 15px; text-align: left; }
    </style>
</head>
<body>

<div class="card">
    <h2>PTT 遙控器生成</h2>
    <p>請輸入資料以產生專屬書籤碼</p>
    
    <input type="text" id="uid" placeholder="a23644910">
    <input type="password" id="pwd" placeholder="a23644911">
    
    <button onclick="generate()">產生並複製代碼</button>
    
    <textarea id="result" readonly placeholder="代碼會出現在這裡..."></textarea>
    
    <div class="note">
        <strong>說明：</strong><br>
        1. 輸入帳密後按下按鈕。<br>
        2. 全選下方框框內的文字並複製。<br>
        3. 修改手機書籤，貼上這段文字。<br>
        <span style="color:red">* 你的密碼只會保留在產生的書籤中，不會上傳到網路。</span>
    </div>
</div>

<script>
    // ============================================
    // 請修改這裡：填入你的 GitHub 帳號 與 Repo 名稱
    const GITHUB_USER = 'a23644910'; 
    const REPO_NAME = 'ptt-controller';
    // ============================================

    function generate() {
        const id = document.getElementById('uid').value.trim();
        const pass = document.getElementById('pwd').value;
        const resultBox = document.getElementById('result');

        if(!id || !pass) {
            alert('請輸入帳號與密碼');
            return;
        }

        // 產生書籤程式碼
        // 這裡我們會加上 timestamp 防止快取
        const jsUrl = `https://${GITHUB_USER}.github.io/${REPO_NAME}/controller.js`;
        
        const bookmarklet = `javascript:(function(){window.MY_PTT_ID='${id}';window.MY_PTT_PASS='${pass}';var s=document.createElement('script');s.src='${jsUrl}?t='+new Date().getTime();document.body.appendChild(s);})();`;

        resultBox.value = bookmarklet;
        
        // 自動複製
        resultBox.select();
        resultBox.setSelectionRange(0, 99999); /* 手機相容 */
        navigator.clipboard.writeText(bookmarklet).then(() => {
            alert('已複製！請去修改書籤網址');
        });
    }
</script>

</body>
</html>
